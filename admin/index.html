<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kasturii Roadways — Secure Administration</title>
<style>
:root{color-scheme:dark}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#10131a;color:#f5f1e8;min-height:100vh;display:grid;place-items:center;margin:0;padding:24px;box-sizing:border-box}
main{max-width:520px;width:100%;background:#1a1f2b;border:1px solid #38322b;border-radius:18px;padding:36px;box-sizing:border-box}
h1{font-size:1.55rem;margin:0 0 12px}p{color:#c9c8c6;line-height:1.65}a.button{display:inline-block;padding:13px 20px;background:#c6a665;color:#10131a;border-radius:8px;text-decoration:none;font-weight:700;margin-top:8px}
small{display:block;color:#a4a5a7;margin-top:20px}#status{color:#f1cf8a}
</style></head><body><main><h1>Kasturii Roadways</h1><p>Secure content management</p>
<p id="status" role="status">Checking CMS configuration…</p><a class="button" id="cms-link" hidden rel="noopener noreferrer">Open Strapi Admin</a>
<small>The previous browser-only demo admin has been disabled. Changes must be made through the authenticated Strapi dashboard; browser localStorage is not a database.</small>
</main><script src="../js/backend-url.js"></script><script>
(function(){const raw=window.KASTURII_API_URL;const status=document.getElementById('status');if(!raw){status.textContent='The secure CMS has not been deployed or configured yet.';return}
try{const url=new URL(raw);if(url.protocol!=='https:' && !['localhost','127.0.0.1'].includes(url.hostname))throw Error('HTTPS required');const link=document.getElementById('cms-link');link.href=url.origin+'/admin';link.hidden=false;status.textContent='Sign in to the Strapi CMS to manage website content.'}catch{status.textContent='CMS URL configuration is invalid.'}})();
</script></body></html>
