<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="320" height="72">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fb923c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1e38;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background pill -->
  <rect width="320" height="72" rx="12" fill="url(#bgGrad)"/>

  <!-- Icon container -->
  <rect x="10" y="10" width="52" height="52" rx="10" fill="url(#iconGrad)"/>

  <!-- Road / highway icon inside orange box -->
  <!-- Road surface -->
  <rect x="24" y="40" width="24" height="12" rx="2" fill="#0a1628" opacity="0.7"/>
  <!-- Road center dashes -->
  <rect x="34" y="42" width="4" height="3" rx="1" fill="#ffffff" opacity="0.9"/>
  <rect x="34" y="47" width="4" height="3" rx="1" fill="#ffffff" opacity="0.9"/>
  <!-- Speed lines (motion lines above road) -->
  <line x1="18" y1="28" x2="32" y2="38" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="24" y1="24" x2="36" y2="37" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  <line x1="30" y1="22" x2="40" y2="36" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <!-- Wheel dots -->
  <circle cx="21" cy="52" r="3" fill="url(#iconGrad)"/>
  <circle cx="51" cy="52" r="3" fill="url(#iconGrad)"/>

  <!-- Company Name -->
  <text x="74" y="34"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="18"
    font-weight="800"
    fill="#ffffff"
    letter-spacing="0.5">KASTURII</text>

  <text x="74" y="53"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="18"
    font-weight="800"
    fill="#f97316"
    letter-spacing="0.5">ROADWAYS</text>

  <!-- Divider line -->
  <line x1="74" y1="58" x2="310" y2="58" stroke="#f97316" stroke-width="1" opacity="0.3"/>

  <!-- Tagline / Pvt Ltd -->
  <text x="74" y="67"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="8"
    font-weight="500"
    fill="#94a3b8"
    letter-spacing="2">PRIVATE LIMITED</text>
</svg>
